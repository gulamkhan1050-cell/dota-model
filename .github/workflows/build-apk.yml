# Builds the Dota 2 Model Android app (dota2-model.apk) whenever the page or the app changes,
# or by hand: Actions -> build apk -> Run workflow.
# The newest APK is always at:
#   https://github.com/gulamkhan1050-cell/dota-model/releases/latest/download/dota2-model.apk
# The daily model needs no new APK: the app downloads model.js (published by "update model") by itself.
#
# Signing: a phone only installs an update over the old app when both are signed with the same key.
# Add your key once as repository secrets ANDROID_KEYSTORE_BASE64 (base64 of keystore.jks) and
# ANDROID_KEYSTORE_PASS. Without them each build gets a new key (uninstall the old app first).
name: build apk

on:
  push:
    branches: [main]
    paths: ["app.template.html", "build.py", "android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Page (app.html from the latest published model)
        run: python build.py

      - name: Android tools
        run: |
          mkdir -p /tmp/t && cd /tmp/t
          pip download aapt2==0.2.1 --no-deps -d . -q && python -m zipfile -e aapt2-0.2.1-py3-none-any.whl x && chmod +x x/aapt2/bin/Linux/aapt2
          curl -sSfL -o android.jar https://raw.githubusercontent.com/Sable/android-platforms/master/android-30/android.jar
          curl -sSfL -o dx.jar https://repo1.maven.org/maven2/com/jakewharton/android/repackaged/dalvik-dx/16.0.1/dalvik-dx-16.0.1.jar
          curl -sSfL -o apksig.jar https://repo1.maven.org/maven2/com/android/tools/build/apksig/2.3.0/apksig-2.3.0.jar

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/keystore.jks; fi

      - name: Build APK
        env:
          AAPT2: /tmp/t/x/aapt2/bin/Linux/aapt2
          ANDROID_JAR: /tmp/t/android.jar
          DX_JAR: /tmp/t/dx.jar
          APKSIG_JAR: /tmp/t/apksig.jar
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'dotamodel' }}
        run: android/build.sh && cp android/build/dota2-model.apk dota2-model.apk

      - name: Publish on the "apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Dota 2 Model app" --notes "Newest Android app. Install dota2-model.apk (Android 7+)." --latest
          gh release upload apk dota2-model.apk --clobber
